<!doctype html>
<html lang="sk">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Hidden form definitions so Netlify Forms registers both site forms. -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>
    <form name="kariera" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
